name: codeql

# Static analysis on the code that runs on other people's machines: the CLI. Two security
# defects reached a signed release here (an arbitrary write through a symlinked directory, and
# an unverified engine being executed), so a second pair of eyes runs on every push.
on:
  push: { branches: [master] }
  pull_request:
  schedule: [{ cron: '0 6 * * 1' }]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v3
        with:
          languages: javascript-typescript
          # Eval seeds are deliberately imperfect starting repositories: finding flaws in them
          # is the point of the eval, not a defect in what we ship. Leaving them in the scan
          # meant a permanently open alert, and an alert nobody acts on trains you to ignore
          # the list. Scan the code users actually run.
          config: |
            paths-ignore:
              - evals/runs/**
              - evals/tasks/**
              - lab/**
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b  # v3

  # CodeQL has no Bash analyzer, and Bash is where the risk actually lives here: the installer
  # resolves paths, follows symlinks and deletes files in someone else's repository. A green
  # CodeQL run said nothing about any of that. ShellCheck is the tool that does.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: every shell script we ship
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y shellcheck >/dev/null
          shellcheck --version | head -2
          # Excluded as false positives here: a printed literal ~ (SC2088), declare-and-assign
          # (SC2155), test-harness readability (SC2034, SC2010), `CDPATH= cd` (SC1007), and a
          # trap-assigned variable (SC2154). SC2318 stays on: it caught a real bug.
          shellcheck -x -S warning -s bash -e SC2088,SC2155,SC2034,SC2010,SC1007,SC2154 \
            install.sh \
            hooks/session-start.sh \
            scripts/preflight.sh \
            scripts/release.sh \
            scripts/verify-release.sh \
            scripts/verify-tools.sh \
            scripts/prove-regression.sh \
            tests/install.test.sh \
            tests/agent-surface.test.sh \
            bin/mastermind \
            .githooks/pre-commit \
            .githooks/pre-push \
            skills/quarantine/assets/pre-commit \
            skills/quarantine/assets/pre-push
