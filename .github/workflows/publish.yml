# Publishes cli/ to npm when a release tag is pushed, via trusted publishing (OIDC):
# no tokens, no OTP, and every release gets a provenance attestation users can verify.
# One-time setup on npmjs.com: package mastermind-brain → Settings → Trusted Publisher →
# GitHub Actions, repository mehrad-dm/mastermind, workflow publish.yml.
name: publish
on:
  push:
    tags: ['v*']
# Least privilege at the workflow level; the publish job below re-grants id-token to itself.
# A workflow-wide `id-token: write` handed a token-minting capability to the gate and to every
# cross-OS job, none of which publish anything.
permissions:
  contents: read
jobs:
  # Publishing used to check only the version string. Everything a release promises is
  # verified here first, and publish depends on it: a red gate means nothing reaches npm.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0           # merge-base cannot answer the check below in a shallow clone
      # The ruleset protects refs/heads/master, and a tag can be pushed from any commit at all.
      # Without this, a version bump that never saw a pull request or a required check could be
      # tagged straight to npm. Nothing else in this job runs until the tag is on master.
      - name: the tagged commit is on master
        run: |
          set -e
          git fetch --no-tags --quiet origin +refs/heads/master:refs/remotes/origin/master
          master="$(git rev-parse --verify refs/remotes/origin/master)"
          git merge-base --is-ancestor "$GITHUB_SHA" "$master" || {
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on master. Release refused."
            exit 1
          }
          echo "$GITHUB_SHA is on master ($master)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "tag/VERSION mismatch"; exit 1; }
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md ||
            { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - run: bash tests/install.test.sh
      - run: bash tests/agent-surface.test.sh
      - run: node scripts/check-integrity.mjs
      - run: node scripts/build-router.mjs --check
      - run: node scripts/check-links.mjs
      - run: node scripts/lint-brain.mjs --strict
      - run: node evals/agent-surface-routing.mjs
      # Repo only until the site checkout below; exit 2 says so rather than passing quietly.
      - run: node scripts/check-prose.mjs || [ "$?" = 2 ]
      - run: node scripts/check-comments.mjs
      - run: node scripts/check-shell-patterns.mjs
      # MASTERMIND_SITE_KEY is a read-only deploy key for the private site repository, scoped to
      # that one repo. This fails the release when it cannot read: the check exists to stop the
      # published pages drifting from the instructions behind them, and a check that shrugs is
      # not one. MM_ALLOW_UNCHECKED_LIBRARY=1 in the repo variables is the deliberate override.
      - id: sitesrc
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mehrad-dm/mastermind-site
          path: site-checkout
          ssh-key: ${{ secrets.MASTERMIND_SITE_KEY }}
      - name: the public library matches the skill and agent sources
        if: steps.sitesrc.outcome == 'success'
        env:
          MASTERMIND_SITE: ${{ github.workspace }}/site-checkout
        run: node scripts/build-library.mjs --check
      - name: no em dashes on the website either
        if: steps.sitesrc.outcome == 'success'
        env:
          MASTERMIND_SITE: ${{ github.workspace }}/site-checkout
        run: node scripts/check-prose.mjs
      - name: refuse to release without checking the library
        if: steps.sitesrc.outcome != 'success'
        run: |
          if [ "${{ vars.MM_ALLOW_UNCHECKED_LIBRARY }}" = "1" ]; then
            echo "::warning::the site could not be read and MM_ALLOW_UNCHECKED_LIBRARY is set, so the library pages were NOT checked"
            echo "· library check skipped by explicit override" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::the site repository could not be read, so the library pages cannot be checked against the skill and agent sources."
          echo "Fix MASTERMIND_SITE_KEY on mastermind-site, or set the repository variable MM_ALLOW_UNCHECKED_LIBRARY=1 to release without this evidence." >&2
          exit 1
      - name: the published tarball contains exactly what we intend
        working-directory: cli
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            // npm 10 prints an ARRAY; npm 12 prints an OBJECT keyed by package name. The two
            // jobs here run different npm versions, so read whichever shape arrives.
            const raw = require("/tmp/pack.json");
            const p = Array.isArray(raw) ? raw[0] : Object.values(raw)[0];
            const files = p.files.map(f => f.path).sort();
            const want = ["README.md", "bin/mastermind.mjs", "package.json"].sort();
            if (JSON.stringify(files) !== JSON.stringify(want))
              { console.error("unexpected tarball contents:", files); process.exit(1) }
            console.log("tarball OK:", files.join(", "));
          '

  # Every platform we claim to support must pass on THIS commit before it can be published.
  cross-os:
    uses: ./.github/workflows/cross-os.yml

  publish:
    needs: [gate, cross-os]
    permissions:
      contents: write            # to create the GitHub Release; nothing else here writes
      id-token: write            # only this job exchanges it for an npm trusted-publish token
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      # OIDC needs npm >= 11.5.1 and Node 22 ships 10.x. No registry-url stub: it made an
      # unauthenticated `npm install -g npm` 404.
      # Pinned, not floating: `npm@latest` would hand a bad release day direct control of the
      # job holding our OIDC identity.
      - run: npm install -g npm@12.0.2 --registry=https://registry.npmjs.org
      - run: npm --version
      # The tarball ships the CLI only; the brain is cloned at install time, so provenance
      # alone does not cover the code users execute. Stamp the exact commit this tag points
      # at: the CLI refuses to install a clone whose HEAD does not match it, which closes
      # the moved-tag hole. Written into the published package only, never committed.
      - name: stamp the immutable commit into the package
        working-directory: cli
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.commit = process.env.GITHUB_SHA;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("pinned to", pkg.commit);
          '
      # The gate job checked the tarball, but that was before the stamp rewrote package.json.
      # What actually ships is this file, so the contract is re-checked against it: the same
      # three paths, the version still matching the tag, and a real commit SHA in the stamp.
      # Pack ONCE, verify that file, publish that file. `npm publish` from the directory repacks,
      # so what shipped was never the thing any check had looked at.
      - name: pack the release artifact
        working-directory: cli
        run: |
          set -e
          npm pack --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack-stamped.json"
          ls -l "$RUNNER_TEMP"/mastermind-brain-*.tgz

      - name: re-verify the stamped package is what we intend to publish
        working-directory: cli
        env:
          PACK_JSON: ${{ runner.temp }}/pack-stamped.json
        run: |
          node -e '
            const fs = require("fs");
            // Same two shapes as the gate job. This step runs the PINNED npm, which is the
            // one that changed, and reading only the array form is what stopped 0.31.0.
            const raw = require(process.env.PACK_JSON);
            const p = Array.isArray(raw) ? raw[0] : Object.values(raw)[0];
            if (!p) { console.error("npm pack --json produced nothing usable"); process.exit(1) }
            const files = p.files.map(f => f.path).sort();
            const want = ["README.md", "bin/mastermind.mjs", "package.json"].sort();
            if (JSON.stringify(files) !== JSON.stringify(want))
              { console.error("unexpected tarball contents:", files); process.exit(1) }
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tag = process.env.GITHUB_REF_NAME;
            if (`v${pkg.version}` !== tag)
              { console.error(`version ${pkg.version} does not match tag ${tag}`); process.exit(1) }
            if (!/^[0-9a-f]{40}$/.test(pkg.commit || ""))
              { console.error("commit stamp is not a full SHA:", pkg.commit); process.exit(1) }
            if (pkg.commit !== process.env.GITHUB_SHA)
              { console.error("commit stamp does not match this run"); process.exit(1) }
            console.log(`stamped package OK: v${pkg.version} @ ${pkg.commit}`);
          '
      # Every check so far read the artifact, none ran it, and cross-OS runs a separate pack.
      # `--version` and `--help` return before the CLI clones, so this needs no network.
      - name: run the artifact that is about to be published
        run: |
          set -e
          tgz="$(ls "$RUNNER_TEMP"/mastermind-brain-*.tgz)"
          echo "smoke testing $tgz"
          npm install -g --prefix "$RUNNER_TEMP/smoke" --no-audit --no-fund "$tgz"
          bin="$RUNNER_TEMP/smoke/bin/mastermind"
          test -x "$bin" || { echo "no binary at $bin"; ls -l "$RUNNER_TEMP/smoke/bin" || true; exit 1; }
          got="$("$bin" --version)"
          [ "$got" = "${GITHUB_REF_NAME#v}" ] ||
            { echo "--version printed '$got', expected '${GITHUB_REF_NAME#v}'"; exit 1; }
          "$bin" --help | grep -q 'mastermind check' || { echo "--help output is not the CLI's"; exit 1; }
          echo "the tarball installs and runs: v$got"
      # Prepared BEFORE publishing. Extracting the notes afterwards meant a missing changelog
      # section published npm permanently and then failed, leaving no Release and no way back.
      - name: prepare the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          V="${TAG#v}"
          notes="$(awk -v v="## [$V]" '
            index($0, v) == 1 { inb = 1; next }
            inb && /^## \[/    { exit }
            inb                { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no '## [$V]' section, so there are no notes to publish" >&2
            exit 1
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
          echo "release notes ready: $(wc -l < "$RUNNER_TEMP/notes.md") lines"

      - name: publish the artifact that was verified
        working-directory: cli
        run: |
          set -e
          tgz="$(ls "$RUNNER_TEMP"/mastermind-brain-*.tgz)"
          echo "publishing $tgz"
          npm publish "$tgz" --provenance --access public

      # Six tags shipped without one, because creating it was a step someone had to remember
      # after the excitement of publishing. The changelog already contains the notes, so this
      # reads them out of the file rather than asking anyone to write them twice.
      - name: publish the GitHub Release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          title="$(git tag -l --format='%(contents:subject)' "$TAG" | head -1)"
          [ -n "$title" ] || title="$TAG"
          # --latest explicitly: GitHub marks the most recently CREATED release as latest, not
          # the highest version, so backfilling an older tag silently demotes the current one.
          gh release create "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest || {
            echo "::error::npm already has $TAG but the GitHub Release was not created. Recover with the command in RELEASING.md."
            exit 1
          }
          echo "released $TAG"
