# Publishes cli/ to npm when a release tag is pushed, via trusted publishing (OIDC):
# no tokens, no OTP, and every release gets a provenance attestation users can verify.
# One-time setup on npmjs.com: package mastermind-brain → Settings → Trusted Publisher →
# GitHub Actions, repository mehrad-dm/mastermind, workflow publish.yml.
name: publish
on:
  push:
    tags: ['v*']
# Least privilege at the workflow level; the publish job below re-grants id-token to itself.
# A workflow-wide `id-token: write` handed a token-minting capability to the gate and to every
# cross-OS job, none of which publish anything.
permissions:
  contents: read
jobs:
  # Publishing used to check only the version string. Everything a release promises is
  # verified here first, and publish depends on it — a red gate means nothing reaches npm.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "tag/VERSION mismatch"; exit 1; }
      - run: bash tests/install.test.sh
      - run: bash tests/agent-surface.test.sh
      - run: node scripts/check-integrity.mjs
      - run: node scripts/build-router.mjs --check
      - run: node scripts/check-links.mjs
      - run: node scripts/lint-brain.mjs --strict
      - run: node evals/agent-surface-routing.mjs
      # The site is a private repository. MASTERMIND_SITE_KEY is a read-only deploy key for it:
      # scoped to that one repo, unlike a token that could read everything the account owns.
      - id: sitesrc
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mehrad-dm/mastermind-site
          path: site-checkout
          ssh-key: ${{ secrets.MASTERMIND_SITE_KEY }}
      - name: the public library matches the skill and agent sources
        if: steps.sitesrc.outcome == 'success'
        env:
          MASTERMIND_SITE: ${{ github.workspace }}/site-checkout
        run: node scripts/build-library.mjs --check
      - name: say so when the library could not be checked
        if: steps.sitesrc.outcome != 'success'
        run: |
          echo "::warning::the site repository could not be read, so the library pages were NOT checked against the skill and agent sources. Check that MASTERMIND_SITE_KEY is still a valid deploy key on mastermind-site."
          echo "· library check skipped: no access to the site repository" >> "$GITHUB_STEP_SUMMARY"
      - name: the published tarball contains exactly what we intend
        working-directory: cli
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            // npm 10 prints an ARRAY; npm 12 prints an OBJECT keyed by package name. The two
            // jobs here run different npm versions, so read whichever shape arrives.
            const raw = require("/tmp/pack.json");
            const p = Array.isArray(raw) ? raw[0] : Object.values(raw)[0];
            const files = p.files.map(f => f.path).sort();
            const want = ["README.md", "bin/mastermind.mjs", "package.json"].sort();
            if (JSON.stringify(files) !== JSON.stringify(want))
              { console.error("unexpected tarball contents:", files); process.exit(1) }
            console.log("tarball OK:", files.join(", "));
          '

  # Every platform we claim to support must pass on THIS commit before it can be published.
  cross-os:
    uses: ./.github/workflows/cross-os.yml

  publish:
    needs: [gate, cross-os]
    permissions:
      contents: write            # to create the GitHub Release; nothing else here writes
      id-token: write            # only this job exchanges it for an npm trusted-publish token
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      # Trusted publishing authenticates over OIDC, so no registry-url/token stub is needed —
      # and that stub made an unauthenticated `npm install -g npm` 404. npm >= 11.5.1 is
      # required for OIDC, and Node 22 ships 10.x.
      # Pinned, not floating: `npm@latest` would hand a release-day npm regression, or a
      # compromised publish, direct control of the job that holds our OIDC identity. Bump this
      # deliberately when a newer npm is wanted; the version only has to satisfy OIDC's >= 11.5.1.
      - run: npm install -g npm@12.0.2 --registry=https://registry.npmjs.org
      - run: npm --version
      # The tarball ships the CLI only; the brain is cloned at install time, so provenance
      # alone does not cover the code users execute. Stamp the exact commit this tag points
      # at — the CLI refuses to install a clone whose HEAD does not match it, which closes
      # the moved-tag hole. Written into the published package only, never committed.
      - name: stamp the immutable commit into the package
        working-directory: cli
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.commit = process.env.GITHUB_SHA;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("pinned to", pkg.commit);
          '
      # The gate job checked the tarball, but that was before the stamp rewrote package.json.
      # What actually ships is this file, so the contract is re-checked against it: the same
      # three paths, the version still matching the tag, and a real commit SHA in the stamp.
      - name: re-verify the stamped package is what we intend to publish
        working-directory: cli
        run: |
          npm pack --dry-run --json > /tmp/pack-stamped.json
          node -e '
            const fs = require("fs");
            // Same two shapes as the gate job. This step runs the PINNED npm, which is the
            // one that changed, and reading only the array form is what stopped 0.31.0.
            const raw = require("/tmp/pack-stamped.json");
            const p = Array.isArray(raw) ? raw[0] : Object.values(raw)[0];
            if (!p) { console.error("npm pack --json produced nothing usable"); process.exit(1) }
            const files = p.files.map(f => f.path).sort();
            const want = ["README.md", "bin/mastermind.mjs", "package.json"].sort();
            if (JSON.stringify(files) !== JSON.stringify(want))
              { console.error("unexpected tarball contents:", files); process.exit(1) }
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tag = process.env.GITHUB_REF_NAME;
            if (`v${pkg.version}` !== tag)
              { console.error(`version ${pkg.version} does not match tag ${tag}`); process.exit(1) }
            if (!/^[0-9a-f]{40}$/.test(pkg.commit || ""))
              { console.error("commit stamp is not a full SHA:", pkg.commit); process.exit(1) }
            if (pkg.commit !== process.env.GITHUB_SHA)
              { console.error("commit stamp does not match this run"); process.exit(1) }
            console.log(`stamped package OK: v${pkg.version} @ ${pkg.commit}`);
          '
      - run: npm publish --provenance --access public
        working-directory: cli

      # Six tags shipped without one, because creating it was a step someone had to remember
      # after the excitement of publishing. The changelog already contains the notes, so this
      # reads them out of the file rather than asking anyone to write them twice.
      - name: publish the GitHub Release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          V="${TAG#v}"
          # The section for this version, without its own heading line.
          notes="$(awk -v v="## [$V]" '
            index($0, v) == 1 { inb = 1; next }
            inb && /^## \[/    { exit }
            inb                { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no '## [$V]' section, so there are no notes to publish" >&2
            exit 1
          fi
          printf '%s\n' "$notes" > /tmp/notes.md
          title="$(git tag -l --format='%(contents:subject)' "$TAG" | head -1)"
          [ -n "$title" ] || title="$TAG"
          # --latest explicitly: GitHub marks the most recently CREATED release as latest, not
          # the highest version, so backfilling an older tag silently demotes the current one.
          gh release create "$TAG" --title "$title" --notes-file /tmp/notes.md --verify-tag --latest
          echo "released $TAG"
