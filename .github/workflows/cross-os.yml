name: cross-os

# The install promises, tested on machines we do not own. macOS is covered by local
# development; these runners cover the rest:
# - ubuntu  → the full install + agent-lookup surface on a real Linux kernel. This is also
#   the honest WSL proxy: WSL2 runs a real Linux kernel with bash/git in a POSIX home, so
#   what passes here is what a WSL user executes. (True in-WSL runs still welcome from any
#   contributor with a Windows machine.)
# - windows → native Windows must refuse loudly with the WSL pointer, never die on a
#   cryptic bash spawn error. That refusal IS the supported behaviour, so it is what we test.
# - alpine  → the no-bash guard message, and the full install once bash exists.

on:
  push:
    branches: [master]
    paths: ['install.sh', 'cli/**', 'bin/**', 'tests/**', '.github/workflows/cross-os.yml']
  workflow_dispatch:
  # Callable so a release can BLOCK on it. These jobs only ran on master pushes, never on a
  # tag, so publish could put a package on npm before any of them had executed for that commit.
  workflow_call:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - name: install into a fresh project and use the lookup surface
        run: |
          set -e
          proj="$(mktemp -d)"
          git -C "$proj" init -q
          (cd "$proj" && bash "$GITHUB_WORKSPACE/install.sh")
          test -f "$proj/.mastermind/VERSION"
          n="$(cd "$proj" && ./.mastermind/bin/mastermind skills --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).skills.length))')"
          echo "skills listed: $n"; test "$n" -ge 20
      - name: installer regression suite
        run: bash tests/install.test.sh
      - name: agent-surface suite
        run: bash tests/agent-surface.test.sh

  windows-native-guard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - name: refuses clearly on native Windows
        shell: pwsh
        run: |
          $out = node cli/bin/mastermind.mjs skills 2>&1
          if ($LASTEXITCODE -eq 0) { throw "expected a non-zero exit on native Windows" }
          if ("$out" -notmatch "WSL") { throw "expected the WSL pointer in: $out" }
          Write-Host "guard message OK: $out"
          # GitHub's pwsh wrapper exits with $LASTEXITCODE, which is node's 1 — the correct
          # refusal. The assertions above already decided the outcome, so end deliberately.
          exit 0

  alpine:
    runs-on: ubuntu-latest
    container: node:22-alpine
    steps:
      - name: no-bash guard, then full install once bash exists
        shell: sh
        run: |
          set -eu
          apk add --no-cache git >/dev/null
          git clone -q "https://github.com/${{ github.repository }}" /brain
          cd /brain && git checkout -q "${{ github.sha }}"
          mkdir -p /work/proj && cd /work/proj && git init -q .

          # The guard under test belongs to the INSTALL path — install.sh needs bash. 0.29.0
          # asserted it against `skills`, a read-only lookup that needs a BRAIN, not bash: it
          # answered "no brain found", the grep for apk guidance never matched, and the step
          # proved nothing. Invoke the installer with no bash present and demand the real message.
          if node /brain/cli/bin/mastermind.mjs >out 2>msg; then
            echo "expected a refusal with no bash installed"; cat out msg; exit 1
          fi
          grep -q "apk add" msg || { echo "wrong refusal:"; cat msg; exit 1; }
          echo "no-bash guard OK: $(cat msg)"
          # It must refuse BEFORE writing anything.
          [ ! -e .mastermind ] || { echo "wrote a brain despite refusing"; exit 1; }

          apk add --no-cache bash >/dev/null
          bash /brain/install.sh >/dev/null 2>&1
          [ -f .mastermind/VERSION ] || { echo "install produced no brain"; exit 1; }
          n=$(./.mastermind/bin/mastermind skills | wc -l)
          [ "$n" -gt 20 ] || { echo "skills table looks empty: $n lines"; exit 1; }
          echo "alpine full install OK — $n lines"

  wsl:
    # The Windows job above only proves the REFUSAL fires. The refusal tells people to use WSL,
    # and until now nothing ever checked that WSL actually works — the docs pointed at an
    # untested path. This runs a genuine Ubuntu under WSL2 on a Windows runner and does the
    # whole install, so the advice is backed by a run rather than an assumption.
    runs-on: windows-latest
    steps:
      - uses: Vampire/setup-wsl@6c400b755bcd0583e60c2e7aa0cdc61794355c9b  # v3.1.4
        with:
          distribution: Ubuntu-24.04
          additional-packages: git curl ca-certificates

      - name: full install inside genuine WSL
        shell: wsl-bash {0}
        run: |
          set -eu
          # Node from NodeSource — the distro package is too old for the CLI.
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null 2>&1
          apt-get install -y nodejs >/dev/null 2>&1
          echo "node $(node --version) · $(uname -sr)"
          grep -qi microsoft /proc/version || { echo "not actually WSL"; exit 1; }

          # Clone inside WSL rather than reaching into /mnt/c — no path translation, and it is
          # the same shape as what a user gets from npx.
          # WSL's shell does NOT inherit the runner's environment, so $GITHUB_REPOSITORY and
          # $GITHUB_SHA are unset in here. Substitute them before the shell starts rather than
          # forwarding env through WSLENV — fewer moving parts, and it fails loudly if wrong.
          git clone -q "https://github.com/${{ github.repository }}" /brain
          cd /brain && git checkout -q "${{ github.sha }}"

          mkdir -p /work/proj && cd /work/proj && git init -q .
          bash /brain/install.sh claude cursor >/dev/null 2>&1
          [ -f .mastermind/VERSION ] || { echo "no project brain"; exit 1; }
          echo "installed $(cat .mastermind/VERSION)"
          n=$(ls .claude/skills | wc -l); [ "$n" -gt 20 ] || { echo "only $n skills linked"; exit 1; }
          [ -f .cursor/rules/mastermind.mdc ] || { echo "no cursor rule"; exit 1; }

          # The commands `init` tells the model to run must work here too.
          node .mastermind/scripts/build-router.mjs >/dev/null
          node .mastermind/scripts/check-integrity.mjs >/dev/null
          ./.mastermind/bin/mastermind skills >/dev/null
          bash /brain/install.sh --check | tail -1
          echo "WSL full install OK — $n skills"
