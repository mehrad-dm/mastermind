name: freshness

# Weekly check that MasterMind's curated resources still resolve, have not moved, and that
# the curriculum hasn't gone stale (a nudge to run `levelup refresh`). Link liveness is
# flaky and belongs to other people's servers, so it never blocks a merge or a release:
# it runs here on a schedule, and on pull requests as a job that cannot fail the run.
# A red run means a cited page died or moved. See scripts/check-links.mjs.

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - run: node scripts/check-links.mjs
